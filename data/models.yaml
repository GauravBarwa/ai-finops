# ──────────────────────────────────────────────────────────────────────────────
# AI FinOps — Model Registry
# Configuration-driven model metadata and pricing.
# Pricing is labeled as *estimated* — actual enterprise costs may differ.
# ──────────────────────────────────────────────────────────────────────────────

models:
  # ── Google Gemini ────────────────────────────────────────────────────────
  - model_id: "gemini-2.0-flash"
    provider: "google"
    display_name: "Gemini 2.0 Flash"
    litellm_model_name: "gemini/gemini-2.0-flash"
    context_window: 1048576
    input_price_per_1m_tokens: 0.10
    output_price_per_1m_tokens: 0.40
    capabilities:
      - summarization
      - classification
      - extraction
      - reasoning
      - code_generation
    enabled: true

  - model_id: "gemini-2.0-flash-lite"
    provider: "google"
    display_name: "Gemini 2.0 Flash-Lite"
    litellm_model_name: "gemini/gemini-2.0-flash-lite"
    context_window: 1048576
    input_price_per_1m_tokens: 0.075
    output_price_per_1m_tokens: 0.30
    capabilities:
      - summarization
      - classification
      - extraction
    enabled: true

  # ── OpenAI ──────────────────────────────────────────────────────────────
  - model_id: "gpt-4o-mini"
    provider: "openai"
    display_name: "GPT-4o Mini"
    litellm_model_name: "gpt-4o-mini"
    context_window: 128000
    input_price_per_1m_tokens: 0.15
    output_price_per_1m_tokens: 0.60
    capabilities:
      - summarization
      - classification
      - extraction
      - reasoning
      - code_generation
    enabled: true

  # ── Anthropic ───────────────────────────────────────────────────────────
  - model_id: "claude-3-haiku"
    provider: "anthropic"
    display_name: "Claude 3 Haiku"
    litellm_model_name: "claude-3-haiku-20240307"
    context_window: 200000
    input_price_per_1m_tokens: 0.25
    output_price_per_1m_tokens: 1.25
    capabilities:
      - summarization
      - classification
      - extraction
      - reasoning
      - code_generation
    enabled: true

  # ── Local / Ollama (disabled by default — enable if Ollama is running) ──
  - model_id: "llama3-local"
    provider: "ollama"
    display_name: "Llama 3 (Local via Ollama)"
    litellm_model_name: "ollama/llama3"
    context_window: 8192
    input_price_per_1m_tokens: 0.0
    output_price_per_1m_tokens: 0.0
    capabilities:
      - summarization
      - classification
      - extraction
    enabled: false
